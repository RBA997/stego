<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Embed</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#d6f0ff,#b3e5ff);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* CARD */
.card{
  background:white;
  padding:45px 40px;
  border-radius:22px;
  box-shadow:0 15px 40px rgba(0,0,0,0.18);
  text-align:center;
  width:90%;
  max-width:550px;
}

h2{
  margin-bottom:20px;
  color:#333;
}

input, select{
  width:80%;
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #ddd;
  outline:none;
  font-family:'Poppins';
}

p{
  font-size:13px;
  color:#666;
  margin-top:5px;
}

/* BUTTON */
button{
  background:linear-gradient(135deg,#0072ff,#00c6ff);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 6px 15px rgba(0,114,255,0.25);
}

button:hover{
  transform:translateY(-6px) scale(1.05);
}

</style>
</head>

<body>

<div class="card">

  <h2>🌊 Embed Watermark</h2>

  <form action="/embed" method="POST" enctype="multipart/form-data">

    <p> Upload image</p>
    <input type="file" name="image">

    <p> Watermark text</p>
    <input type="text" name="watermark" placeholder="Enter watermark">

    <p> Methods (LSB / DCT / DWT)</p>
    <select name="method">
  <option value="lsb">LSB</option>
  <option value="dct">DCT</option>
  <option value="dwt">DWT</option>
</select>

    <br><br>

    <button type="submit">Run Embed</button>

  </form>

</div>

</body>
</html>
